name: URCTrumps
options:
  bundleIdPrefix: com.ridgbaks
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: SHV4CBAT92
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # CI overrides this with the GitHub run number so every upload is unique.
    CURRENT_PROJECT_VERSION: "1"

targets:
  URCTrumps:
    type: application
    platform: iOS
    sources:
      - path: URCTrumps
        excludes:
          - "Resources/GameData/**"
      # Generated by scripts/export_app_data.py (gitignored); a folder reference keeps headshots/ intact.
      - path: URCTrumps/Resources/GameData
        type: folder
        buildPhase: resources
    info:
      path: URCTrumps/Info.plist
      properties:
        CFBundleDisplayName: URC Trumps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - BigShouldersDisplay-Black.ttf
          - BigShouldersDisplay-ExtraBold.ttf
          - BarlowCondensed-Medium.ttf
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridgbaks.urctrumps
        PRODUCT_NAME: URCTrumps
        # iPhone only. Must be on the target: XcodeGen doesn't carry the project-level value into the target,
        # and App Store Connect rejects a portrait-only build that also claims iPad.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  URCTrumpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: URCTrumpsTests
    dependencies:
      - target: URCTrumps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridgbaks.urctrumps.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/URCTrumps.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/URCTrumps

schemes:
  URCTrumps:
    build:
      targets:
        URCTrumps: all
        URCTrumpsTests: [test]
    test:
      targets:
        - URCTrumpsTests
